<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tnpsc.gov.in - Notifications</title>
</head>
<body>
<div id="app"></div>
<script>
  const payload = [
    { title: "CCSE-I (Group-I Services) Notification", date: "12-Aug-2026", link: "/documents/ccse1.pdf" },
    { title: "Group-II (Interview Posts) Results Released", date: "08-Aug-2026", link: "/documents/group2.pdf" },
    { title: "Combined Engineering Services Exam Date Announcement", date: "01-Aug-2026", link: "/documents/cese.pdf" }
  ];
  document.getElementById("app").innerHTML = payload.map(function (n) {
    return '<div class="list-item"><span class="l-title">' + n.title + '</span><span class="l-date">' + n.date + '</span><a class="l-link" href="' + n.link + '">View</a></div>';
  }).join("");
</script>
</body>
</html>
